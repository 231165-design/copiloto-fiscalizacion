# Configuración por defecto para sam build / deploy
# Edita stack_name y region según tu cuenta AWS.

version = 0.1

[default.global.parameters]
stack_name    = "copiloto-fiscalizacion"
region        = "us-east-1"       # cambia a tu región más cercana
confirm_changeset = true
resolve_s3    = true              # SAM crea el bucket de artefactos automáticamente

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities  = "CAPABILITY_IAM"
parameter_overrides = "StageName=prod"
